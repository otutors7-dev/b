<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relative</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            margin: 10px;
            left: 100px;
            top: 100px;
            position: relative;
        }
    </style>
</head>

<body>
    <div style="background-color: aqua;"> div1 </div>
    <div style="background-color: aquamarine;"> div2 </div>
    <div style="background-color: bisque;"> div3 </div>
    <div style="background-color: brown;"> div4 </div>
</body>

</html>
