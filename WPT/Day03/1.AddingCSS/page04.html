<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <link rel="stylesheet" href="mystyle.css">

    <style>
        /* CSS RULE */
        /* selector + declaration block */
        div {
            /* declarations */
            /* css property : value */
            color: red;
        }
    </style>

</head>

<body>

    <div>This is div 1</div>
    <div>This is div 2</div>
    <div>This is div 3</div>
    <div style="color: green;">This is div 4</div>
    <div style="color: green;">This is div 5</div>
    <div>This is div 6</div>
</body>

</html>
