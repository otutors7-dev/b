<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            margin: 10px;
            /* by default the display is block for div */
            /* display: block; */

            /* It ignores the width and height */
            /* display: inline; */

            /* display: inline-block; */

            display: inline-block;
        }
    </style>
</head>

<body>
    <div style="background-color: antiquewhite;">1</div>
    <div style="background-color: aqua;">2</div>
    <div style="background-color: aquamarine;">3</div>
    <div style="background-color: brown;">4</div>
    <h1>This is a header</h1>
</body>

</html>
