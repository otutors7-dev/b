<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display</title>
    <style>
        .container {
            background-color: antiquewhite;
            display: flex;
            /* by default flex direction */
            /* flex-direction: row; */
            /* flex-direction: row-reverse; */
            /* flex-direction: column; */
            flex-direction: column-reverse;
        }

        .mydiv {
            width: 100px;
            height: 100px;
            margin: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="mydiv" style="background-color: aqua;">1</div>
        <div class="mydiv" style="background-color: aquamarine;">2</div>
        <div class="mydiv" style="background-color: blueviolet;">3</div>
        <div class="mydiv" style="background-color: brown;">4</div>
    </div>
</body>

</html>
