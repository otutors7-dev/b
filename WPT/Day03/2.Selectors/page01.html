<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
        /* Element Selector */
        div {
            color: red;
        }

        p {
            color: green;
        }
    </style>
</head>

<body>
    <div>This is a div 1</div>
    <div>This is a div 2</div>
    <div>This is a div 3</div>
    <div>This is a div 4</div>

    <p>This is para 1</p>
    <p>This is para 2</p>
    <p>This is para 3</p>
</body>

</html>
