<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
        div {
            width: 100px;
            height: 100px;
        }

        /* pseudo selectors */

        div:nth-child(even) {
            background-color: red;
        }

        div:nth-child(odd) {
            background-color: green;
        }

        div:hover {
            background-color: yellow;
        }


        [type="submit"] {
            background-color: rgb(74, 74, 221);
            width: 200px;
            height: 50px;
        }

        [type="submit"]:active {
            background-color: rgb(111, 111, 227);
        }
    </style>
</head>

<body>

    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>

    <input type="submit" value="save">

</body>

</html>
