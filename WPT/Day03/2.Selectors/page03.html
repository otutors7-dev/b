<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
        /*  Class Selector */
        .mydiv {
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>
    <div>This is a div 1</div>
    <div class="mydiv">This is a div 2</div>
    <div>This is a div 3</div>
    <div>This is a div 4</div>
    <div class="mydiv">This is a div 5</div>
    <div>This is a div 6</div>

</body>

</html>
