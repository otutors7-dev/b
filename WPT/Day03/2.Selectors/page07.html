<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
        /* Attribute selector */
        [type="submit"] {
            background-color: rgb(68, 111, 204);
            width: 200px;
            height: 50px;
        }

        [type="reset"] {
            background-color: red;
            width: 150px;
            height: 50px;
        }
    </style>
</head>

<body>
    <input type="submit" value="save">
    <input type="reset" value="cancel">

</body>

</html>
