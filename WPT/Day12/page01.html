<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Home Page</h2>
    <button onclick="displaySignin()">display signin</button>
    <button onclick="displaySignup()">display signup</button>
    <button onclick="displayFood()">display Food Menu</button>
    <div id="root">

    </div>
    <script>
        const root = document.getElementById('root')

        function displaySignin() {
            const signinPage = `<h1>Signin Page</h1>`
            root.innerHTML = signinPage

        }
        function displaySignup() {
            const signupPage = `<h1>Signup Page</h1>`
            root.innerHTML = signupPage

        }
        function displayFood() {
            const foodPage = `<h1>Food Menu</h1>`
            root.innerHTML = foodPage

        }
    </script>
</body>

</html>
