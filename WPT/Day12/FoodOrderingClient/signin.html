<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signin</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="w-3xl mx-auto p-2">
        <h1 class="text-xl">User Signin</h1>
        <div class="m-2 p-2">
            <label class="floating-label">
                <span>Email</span>
                <input type="email" placeholder="mail@site.com" id="inputEmail" class="input input-md" />
            </label>
        </div>
        <div class="m-2 p-2">
            <label class="floating-label">
                <span>Password</span>
                <input type="password" placeholder="*******" id="inputPassword" class="input input-md" />
            </label>
        </div>
        <div class="m-2 p-2">
            <label for="">Don't have an Account </label>
            <a href="signup.html" class="text-blue-700">Register Here</a>
        </div>
        <div class="m-2 p-2">
            <button class="btn btn-success" onclick="signin()">signin</button>
        </div>
    </div>
    <script>
        async function signin() {
            const email = document.getElementById('inputEmail').value
            const password = document.getElementById('inputPassword').value
            console.log(`${email} - ${password}`)
            try {
                const response = await fetch('http://localhost:4000/user/signin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        "email": email,
                        "password": password
                    })
                })
                console.log(response)
                const result = await response.json()
                console.log(result)
                if (result.status == 'success') {
                    window.sessionStorage.token = result.data.token
                    window.location.href = 'foodmenu.html'
                }
                else
                    window.alert(result.error)
            } catch (error) {
                console.log(error)
            }


        }
    </script>
</body>

</html>
