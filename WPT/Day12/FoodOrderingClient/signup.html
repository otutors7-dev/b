<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="w-3xl mx-auto p-2">
        <h1 class="text-xl">User Signup</h1>
        <div class="m-2 p-2">
            <label class="floating-label">
                <span>Name</span>
                <input type="text" placeholder="name" id="inputName" class="input input-md" />
            </label>
        </div>
        <div class="m-2 p-2">
            <label class="floating-label">
                <span>Email</span>
                <input type="email" placeholder="mail@site.com" id="inputEmail" class="input input-md" />
            </label>
        </div>
        <div class="m-2 p-2">
            <label class="floating-label">
                <span>Password</span>
                <input type="password" placeholder="*******" id="inputPassword" class="input input-md" />
            </label>
        </div>
        <div class="m-2 p-2">
            <label class="floating-label">
                <span>Mobile</span>
                <input type="tel" placeholder="+91" id="inputMobile" class="input input-md" />
            </label>
        </div>
        <div class="m-2 p-2">
            <label for="">Already have an Account? </label>
            <a href="signin.html" class="text-blue-700">Signin Here</a>
        </div>
        <div class="m-2 p-2">
            <button class="btn btn-success" onclick="signup()">signup</button>
        </div>
    </div>
    <script>
        async function signup() {
            const name = document.getElementById('inputName').value
            const email = document.getElementById('inputEmail').value
            const password = document.getElementById('inputPassword').value
            const mobile = document.getElementById('inputMobile').value

            try {
                const response = await fetch('http://localhost:4000/user/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        "name": name,
                        "email": email,
                        "password": password,
                        "mobile": mobile
                    })
                })
                console.log(response)
                const result = await response.json()
                if (result.status == 'success') {
                    alert('signup successful')
                    window.location.href = 'signin.html'
                }
                else
                    window.alert(result.error)
            } catch (error) {
                console.log(error)
            }


        }
    </script>
</body>

</html>
