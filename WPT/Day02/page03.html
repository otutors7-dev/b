<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio,Checkbox,select</title>
</head>

<body>
    <h2>Radio, Checkbox, <Select:d></Select:d>
    </h2>
    <form>
        <div>
            <label>Gender : </label>
            <input type="radio" name="gender" value="m">Male
            <input type="radio" name="gender" value="f">Female
        </div>

        <div>
            <label>Skills</label>
            <input type="checkbox" name="checkbox" value="cpp"> CPP
            <input type="checkbox" name="checkbox" value="java"> JAVA
            <input type="checkbox" name="checkbox" value="sql"> SQL
            <input type="checkbox" name="checkbox" value="c#"> C#
        </div>

        <div>
            <label>city</label>
            <select name="city">
                <option value="1">Pune</option>
                <option value="2">Mumbai</option>
                <option value="3">Delhi</option>
                <option value="4">B'lore</option>
            </select>
        </div>

        <input type="submit" value="save">
    </form>
</body>

</html>
