<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Orignal DOM Manipulation</h1>
    <button onclick="getProducts()">Get Products</button>
    <ol id="root">

    </ol>
    <script>
        function getProducts() {
            const ol = document.getElementById('root');
            const st = window.performance.now()
            for (let i = 1; i <= 2500; i++) {
                const li = `<li>Product - ${i}</li>`
                ol.innerHTML += li
            }
            const et = window.performance.now()
            const diff = et - st
            console.log(`Total Time Taken - ${diff.toFixed(2)} ms`)
        }
        // 10 -> 0.30 ms
        // 100 -> 9.20 ms
        // 1000 -> 770.10 ms
        // 2500 ->
        // 5000 -> ?
        // 10000 -> ?
    </script>
</body>

</html>
