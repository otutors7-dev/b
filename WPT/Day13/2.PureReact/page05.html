<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Added the react library -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

</head>

<body>
    <h1>Virtual DOM Manipulation</h1>
    <div id="root">

    </div>
    <script>
        const domContainer = document.getElementById('root');
        const root = ReactDOM.createRoot(domContainer);
        // const h2 = React.createElement("h2", null, "Welcome to React")
        // const h3 = React.createElement("h4", null, "Using CDN links")
        // root.render([h2, h3])

        const h1 = React.createElement("h1", null, "This is a header")
        const p1 = React.createElement("p", null, "This is para 1")
        const p2 = React.createElement("p", null, "This is para 2")
        const div = React.createElement("div", null, [p1, p2])

        const ui = `
            <h1>This is a header</h1>
            <div>
                <p>This is para 1</p>
                <p>This is para 2</p>
            </div>
        `
        root.render([h1, div])
    </script>
</body>

</html>
