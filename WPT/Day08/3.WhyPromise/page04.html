<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="internalLibraryPromiseBased.js"></script>

</head>

<body>
    <input type="number" placeholder="enter emp id" id="input_empid">
    <button onclick="getEmployeeDetails()">Display Employee Record</button>
    <script>
        async function getEmployeeDetails() {
            const empid = document.getElementById('input_empid').value
            try {
                const emp = await searchEmployee(empid)
                console.log(emp)
                const dept = await searchDepartment(emp.deptno)
                console.log(dept)
            } catch (error) {
                console.log(error)
            }
        }
    </script>
</body>

</html>
